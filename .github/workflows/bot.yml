name: Aster Trading Bot

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

concurrency:
  group: aster-bot
  cancel-in-progress: false

jobs:
  trade:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run bot
        env:
          ASTER_API_KEY: ${{ secrets.ASTER_API_KEY }}
          ASTER_SECRET_KEY: ${{ secrets.ASTER_SECRET_KEY }}
          ASTER_AGENT_ADDRESS: ${{ secrets.ASTER_AGENT_ADDRESS }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py

      - name: Commit state
        run: |
          git config --local user.email "bot@github.com"
          git config --local user.name "Trading Bot"
          git add trading_state.json || true
          git diff --quiet && git diff --staged --quiet || git commit -m "Update state [skip ci]"
          git push || true
